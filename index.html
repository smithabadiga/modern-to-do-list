<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks — Modern To-Do List</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons via CDN -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <!-- Google Font for a polished, professional look -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <script>
    // Enable Tailwind's class-based dark mode so we can toggle it with JS
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          },
          animation: {
            "fade-in": "fadeIn 0.35s ease-out",
            "fade-out": "fadeOut 0.25s ease-in forwards",
            "slide-in": "slideIn 0.3s ease-out",
          },
          keyframes: {
            fadeIn: {
              "0%": { opacity: 0, transform: "translateY(-8px) scale(0.98)" },
              "100%": { opacity: 1, transform: "translateY(0) scale(1)" },
            },
            fadeOut: {
              "0%": { opacity: 1, transform: "translateY(0) scale(1)", maxHeight: "200px" },
              "100%": { opacity: 0, transform: "translateY(-8px) scale(0.95)", maxHeight: "0px" },
            },
            slideIn: {
              "0%": { opacity: 0, transform: "translateX(30px)" },
              "100%": { opacity: 1, transform: "translateX(0)" },
            },
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: "Inter", sans-serif;
    }
    /* Gradient background — light & dark variants */
    .app-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 45%, #f093fb 100%);
    }
    .dark .app-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #312e81 100%);
    }
    /* Glassmorphism helper */
    .glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .dark .glass {
      background: rgba(30, 27, 75, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* Custom scrollbar for the task list */
    #taskList::-webkit-scrollbar {
      width: 6px;
    }
    #taskList::-webkit-scrollbar-thumb {
      background: rgba(120, 120, 160, 0.4);
      border-radius: 999px;
    }
    /* Explicit keyframes (plain CSS, not dependent on Tailwind's JIT
       detecting an animate-* utility class in the markup) */
    @keyframes fadeOut {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-8px) scale(0.95); }
    }
    @keyframes slideIn {
      0%   { opacity: 0; transform: translateX(30px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeIn {
      0%   { opacity: 0; transform: translateY(-8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Smooth removal animation class */
    .task-removing {
      animation: fadeOut 0.25s ease-in forwards;
    }
    .task-entering {
      animation: slideIn 0.3s ease-out;
    }
    .animate-fade-in {
      animation: fadeIn 0.35s ease-out;
    }
  </style>
</head>

<body class="app-bg min-h-screen transition-colors duration-500">
  <div class="min-h-screen w-full px-4 py-6 sm:py-10 flex flex-col items-center">
    <div class="w-full max-w-2xl">

      <!-- ===================== HEADER ===================== -->
      <header class="flex items-center justify-between mb-6 sm:mb-8">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-white/25 glass flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-list-check text-white text-lg sm:text-xl"></i>
          </div>
          <div>
            <h1 class="text-white font-extrabold text-xl sm:text-2xl leading-tight drop-shadow-sm">My Tasks</h1>
            <p id="currentDate" class="text-white/80 text-xs sm:text-sm font-medium"></p>
          </div>
        </div>

        <button
          id="themeToggle"
          aria-label="Toggle dark or light mode"
          class="w-11 h-11 rounded-2xl glass shadow-lg flex items-center justify-center text-white hover:scale-105 active:scale-95 transition-transform duration-200"
        >
          <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
        </button>
      </header>

      <!-- ===================== MAIN CARD ===================== -->
      <main class="glass rounded-3xl shadow-2xl p-5 sm:p-7 space-y-6">

        <!-- Progress Section -->
        <section aria-label="Progress overview">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-white font-bold text-base sm:text-lg dark:text-white text-slate-800">Today's Tasks</h2>
            <span id="progressPercent" class="text-white/90 dark:text-white/90 text-slate-700 font-semibold text-sm">0%</span>
          </div>
          <div class="w-full h-3 rounded-full bg-white/30 dark:bg-white/10 overflow-hidden">
            <div
              id="progressBar"
              class="h-full rounded-full bg-gradient-to-r from-emerald-400 to-teal-400 transition-all duration-500 ease-out"
              style="width: 0%"
            ></div>
          </div>
        </section>

        <!-- Add Task Section -->
        <section aria-label="Add a new task" class="space-y-3">
          <div class="flex flex-col sm:flex-row gap-2">
            <label for="taskInput" class="sr-only">Task title</label>
            <input
              id="taskInput"
              type="text"
              maxlength="120"
              placeholder="What do you need to do?"
              class="flex-1 px-4 py-3 rounded-2xl bg-white/70 dark:bg-white/10 text-slate-800 dark:text-white placeholder-slate-500 dark:placeholder-white/50 outline-none focus:ring-2 focus:ring-white/70 transition-all duration-200 shadow-inner"
            />
            <div class="flex gap-2">
              <label for="prioritySelect" class="sr-only">Priority</label>
              <select
                id="prioritySelect"
                class="px-3 py-3 rounded-2xl bg-white/70 dark:bg-white/10 text-slate-800 dark:text-white outline-none focus:ring-2 focus:ring-white/70 transition-all duration-200 shadow-inner cursor-pointer"
              >
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
              <button
                id="addTaskBtn"
                class="px-5 py-3 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-semibold shadow-lg hover:shadow-xl active:scale-95 transition-all duration-200 flex items-center gap-2 whitespace-nowrap"
              >
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">Add Task</span>
              </button>
            </div>
          </div>
        </section>

        <!-- Search & Filters -->
        <section aria-label="Search and filter tasks" class="space-y-3">
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-white/50"></i>
            <label for="searchInput" class="sr-only">Search tasks</label>
            <input
              id="searchInput"
              type="text"
              placeholder="Search tasks..."
              class="w-full pl-11 pr-4 py-2.5 rounded-2xl bg-white/60 dark:bg-white/10 text-slate-800 dark:text-white placeholder-slate-500 dark:placeholder-white/50 outline-none focus:ring-2 focus:ring-white/70 transition-all duration-200 shadow-inner"
            />
          </div>

          <div class="flex gap-2" role="tablist" aria-label="Task filters">
            <button data-filter="all" class="filter-btn flex-1 py-2 rounded-xl text-sm font-semibold transition-all duration-200" aria-pressed="true">All</button>
            <button data-filter="active" class="filter-btn flex-1 py-2 rounded-xl text-sm font-semibold transition-all duration-200" aria-pressed="false">Active</button>
            <button data-filter="completed" class="filter-btn flex-1 py-2 rounded-xl text-sm font-semibold transition-all duration-200" aria-pressed="false">Completed</button>
          </div>
        </section>

        <!-- Task List -->
        <section aria-label="Task list">
          <ul id="taskList" class="space-y-3 max-h-[420px] overflow-y-auto pr-1"></ul>

          <!-- Empty state -->
          <div id="emptyState" class="hidden flex-col items-center justify-center text-center py-10">
            <i class="fa-regular fa-circle-check text-4xl text-white/70 dark:text-white/40 mb-3"></i>
            <p class="text-white/90 dark:text-white/70 font-semibold">No tasks here</p>
            <p class="text-white/70 dark:text-white/50 text-sm">Add a task above to get started</p>
          </div>
        </section>

        <!-- Footer -->
        <footer class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-white/30 dark:border-white/10">
          <div class="text-white/90 dark:text-white/80 text-sm font-medium flex gap-3">
            <span><i class="fa-solid fa-list mr-1"></i><span id="totalCount">0</span> total</span>
            <span><i class="fa-solid fa-check mr-1"></i><span id="completedCount">0</span> done</span>
          </div>
          <button
            id="clearCompletedBtn"
            class="text-sm font-semibold text-white/90 dark:text-white/80 hover:text-red-200 transition-colors duration-200 flex items-center gap-1"
          >
            <i class="fa-solid fa-trash"></i> Clear Completed
          </button>
        </footer>
      </main>

      <p class="text-center text-white/60 text-xs mt-6">Built with HTML, Tailwind CSS &amp; Vanilla JavaScript</p>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 items-end"></div>

  <!-- Delete confirmation modal -->
  <div id="confirmModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/40 px-4">
    <div class="glass rounded-2xl shadow-2xl p-6 max-w-sm w-full animate-fade-in">
      <h3 class="text-slate-800 dark:text-white font-bold text-lg mb-2">Delete task?</h3>
      <p class="text-slate-600 dark:text-white/70 text-sm mb-5">This action cannot be undone. Are you sure you want to delete this task?</p>
      <div class="flex justify-end gap-3">
        <button id="cancelDeleteBtn" class="px-4 py-2 rounded-xl bg-white/60 dark:bg-white/10 text-slate-700 dark:text-white font-semibold hover:bg-white/80 dark:hover:bg-white/20 transition-colors duration-200">Cancel</button>
        <button id="confirmDeleteBtn" class="px-4 py-2 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold transition-colors duration-200">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
